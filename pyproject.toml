[build-system]
requires = [
    "setuptools>=77",
    "pybind11>=2.12",
    "numpy",
]
build-backend = "setuptools.build_meta"

[project]
name = "flsss"
version = "0.1.5"
description = "Python bindings for the FLSSS subset-sum solver"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Charlie Wusuo Liu", email = "liuwusuo@gmail.com" },
]
requires-python = ">=3.9"
dependencies = ["numpy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.exclude-package-data]
flsss = ["*.so", "*.pyd", "*.dll", "*.pyc"]

[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*-win32 *-manylinux_i686 *-musllinux_*"
test-command = "python -c \"import flsss, numpy as np; x=np.array([1,2,3], dtype=np.int32); assert flsss.gen(x, 3, 3, len=2)\""
build-verbosity = 1
manylinux-x86_64-image = "manylinux_2_28"

[tool.cibuildwheel.linux]
archs = "x86_64"

[tool.cibuildwheel.macos]
archs = "auto"
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }

[tool.cibuildwheel.windows]
archs = "AMD64"
